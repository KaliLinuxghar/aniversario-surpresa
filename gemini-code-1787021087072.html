<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti - Viagem Estelar 🤍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0b0105;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        #webgl {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: block;
        }

        .ui-top-title {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
            pointer-events: none;
        }

        .ui-top-title span {
            color: #ff416c;
        }

        .botoes-topo {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 20;
            display: flex;
            gap: 10px;
        }

        .btn-acao {
            background: rgba(255, 65, 108, 0.2);
            border: 1px solid rgba(255, 65, 108, 0.5);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .btn-acao:hover {
            background: rgba(255, 65, 108, 0.4);
        }

        #btn-carta {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 20;
            background: rgba(20, 5, 10, 0.8);
            border: 1px solid rgba(255, 105, 180, 0.6);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.4);
            transition: transform 0.3s;
        }

        #btn-carta:hover {
            transform: scale(1.1);
        }

        .foto-label {
            position: absolute;
            background: rgba(20, 4, 12, 0.92);
            border: 1.5px solid rgba(255, 105, 180, 0.7);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            pointer-events: none;
            max-width: 250px;
            box-shadow: 0 6px 20px rgba(255, 20, 147, 0.35);
            transition: opacity 0.2s ease, transform 0.2s ease;
            display: none;
            z-index: 10;
        }

        #modal-carta {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 1, 3, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .carta-box {
            background: rgba(25, 8, 15, 0.95);
            border: 1px solid rgba(255, 105, 180, 0.5);
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.4);
            padding: 30px 40px;
            border-radius: 20px;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }

        .carta-box h3 {
            color: #ff69b4;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .carta-box p {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #fce4ec;
        }

        .btn-fechar {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border: none;
            padding: 10px 25px;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }

        #question-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 1, 5, 0.95);
            backdrop-filter: blur(10px);
            z-index: 150;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: rgba(20, 5, 12, 0.95);
            border: 1px solid rgba(255, 105, 180, 0.4);
            box-shadow: 0 0 40px rgba(255, 20, 147, 0.3);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        .modal-box h3 {
            font-size: 18px;
            margin-bottom: 25px;
            line-height: 1.4;
            font-weight: 500;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            transition: transform 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="question-modal">
        <div class="modal-box">
            <h3>Para ti 🤍 Quer iniciar a viagem?</h3>
            <button class="btn" id="start-btn">Começar 💖</button>
        </div>
    </div>

    <div class="ui-top-title" style="display: none;" id="main-title">
        Para ti <span>❤️</span>
    </div>

    <div class="botoes-topo">
        <button id="btn-modo" style="display: none;" class="btn-acao">🎥 Auto: OFF</button>
    </div>
    
    <button id="btn-carta" style="display: none;" title="Mensagem">💌</button>

    <div id="modal-carta">
        <div class="carta-box">
            <h3>✨ Mensagem Especial ✨</h3>
            <p>Independente de tudo que está acontecendo, você é forte, capaz e cheia de luz. Nunca se esqueça do seu valor e da sua capacidade de vencer qualquer obstáculo! 🤍</p>
            <button class="btn-fechar" id="fechar-carta">Fechar e voltar</button>
        </div>
    </div>

    <div id="labels-container"></div>

    <canvas id="webgl"></canvas>

    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <script>
        const FOTOS = [];
        const totalDeFotos = 100;
        for (let i = 1; i <= totalDeFotos; i++) {
            FOTOS.push(`img/foto (${i}).jpg`);
        }

        const mensagensFotos = [
            "Independente de tudo que está acontecendo, nao tire seu lindo sorriso do rosto, vença garota!! ✨",
            "Nunca desista dos seus sonhos 🤍",
            "Jamais permita que apaguem seu brilho 🌟",
            "Você é muito mais forte do que imagina 💪",
            "Sua garra e sua determinação são admiráveis 🌺",
            "Acredite no seu potencial, você vai longe 🚀",
            "Cada obstáculo é apenas um degrau para o seu sucesso 💫",
            "O seu sorriso tem o poder de iluminar qualquer dia ☀️",
            "Mantenha a cabeça erguida, grandes coisas estão por vir 🌻",
            "Você é capaz de conquistar tudo o que deseja 🎯",
            "Respire fundo e siga em frente com coragem 💙",
            "Sua luz própria incomoda quem vive na sombra ✨",
            "Confie na sua força interior, você é incrível 🌿"
        ];

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0b0105, 0.0015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
        camera.position.set(0, 0, 1400);

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enabled = false;

        const galaxiaGrupo = new THREE.Group();
        scene.add(galaxiaGrupo);

        function criarTexturaRedonda() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.beginPath();
            ctx.arc(16, 16, 14, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }
        const texturaRedonda = criarTexturaRedonda();

        // 1. Redemoinho (Túnel Inicial)
        let vortexParticles, vortexGeometry;
        const qtdVortex = 6000;

        function criarVortexParticulas() {
            vortexGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array(qtdVortex * 3);
            const colors = new Float32Array(qtdVortex * 3);

            const cRosa = new THREE.Color('#ff416c');
            const cRoxa = new THREE.Color('#ba55d3');
            const cBranca = new THREE.Color('#ffffff');

            for (let i = 0; i < qtdVortex; i++) {
                const raioTunel = 15 + Math.random() * 80;
                const angulo = Math.random() * Math.PI * 2;
                const zPos = (Math.random() - 0.5) * 3500;

                positions[i * 3] = Math.cos(angulo) * raioTunel;
                positions[i * 3 + 1] = Math.sin(angulo) * raioTunel;
                positions[i * 3 + 2] = zPos;

                let mix = Math.random();
                let c = mix > 0.5 ? cRosa : (mix > 0.2 ? cRoxa : cBranca);

                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;
            }

            vortexGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            vortexGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 1.5,
                map: texturaRedonda,
                vertexColors: true,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            vortexParticles = new THREE.Points(vortexGeometry, material);
            scene.add(vortexParticles);
        }
        criarVortexParticulas();

        // 2. Explosão de Partículas
        let explosionParticles;
        function criarExplosao() {
            const qtd = 4000;
            const geom = new THREE.BufferGeometry();
            const pos = new Float32Array(qtd * 3);
            const vel = [];
            const cols = new Float32Array(qtd * 3);
            const cor = new THREE.Color('#ff69b4');
            const cor2 = new THREE.Color('#ffffff');

            for (let i = 0; i < qtd; i++) {
                pos[i*3] = (Math.random() - 0.5) * 10;
                pos[i*3+1] = (Math.random() - 0.5) * 10;
                pos[i*3+2] = (Math.random() - 0.5) * 10;

                vel.push(new THREE.Vector3(
                    (Math.random() - 0.5) * 60,
                    (Math.random() - 0.5) * 60,
                    -Math.random() * 70 - 30
                ));

                let c = Math.random() > 0.5 ? cor : cor2;
                cols[i*3] = c.r;
                cols[i*3+1] = c.g;
                cols[i*3+2] = c.b;
            }

            geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geom.setAttribute('color', new THREE.BufferAttribute(cols, 3));

            const mat = new THREE.PointsMaterial({ size: 1.5, map: texturaRedonda, vertexColors: true, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false });
            explosionParticles = { mesh: new THREE.Points(geom, mat), velocities: vel, active: false };
            scene.add(explosionParticles.mesh);
        }
        criarExplosao();

        // 3. Galáxia 3D Complexa e Detalhada
        const meshesFotos = [];
        const labelsData = [];
        const containerLabels = document.getElementById('labels-container');

        function criarGalaxiaDetalhada() {
            const quantidade = 35000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(quantidade * 3);
            const colors = new Float32Array(quantidade * 3);

            const corRosa = new THREE.Color('#ff2a6d');
            const corRoxa = new THREE.Color('#c71585');
            const corAzul = new THREE.Color('#1e90ff');
            const corBranca = new THREE.Color('#ffffff');

            const bracos = 3; // 3 braços espirais para maior complexidade

            for (let i = 0; i < quantidade; i++) {
                const r = Math.pow(Math.random(), 0.8) * 180;
                const ramo = (i % bracos) * ((2 * Math.PI) / bracos);
                const anguloEspiral = r * 0.06 + ramo;

                const x = Math.cos(anguloEspiral) * r + (Math.random() - 0.5) * 12;
                const y = (Math.random() - 0.5) * (18 * (1 - r / 180));
                const z = Math.sin(anguloEspiral) * r + (Math.random() - 0.5) * 12;

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                let mix = Math.random();
                let c = mix > 0.5 ? corRosa : (mix > 0.25 ? corRoxa : (mix > 0.1 ? corAzul : corBranca));

                colors[i * 3] = c.r;
                colors[i * 3 + 1] = c.g;
                colors[i * 3 + 2] = c.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const materialParticles = new THREE.PointsMaterial({
                size: 0.5,
                map: texturaRedonda,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            galaxiaGrupo.add(new THREE.Points(geometry, materialParticles));

            const textureLoader = new THREE.TextureLoader();

            FOTOS.forEach((fotoSrc, index) => {
                const r = 30 + (index / FOTOS.length) * 120;
                const ramo = (index % 3) * ((2 * Math.PI) / 3);
                const angulo = r * 0.06 + ramo;

                const x = Math.cos(angulo) * r;
                const z = Math.sin(angulo) * r;
                const y = (Math.random() - 0.5) * 6;

                const planeGeo = new THREE.PlaneGeometry(5, 6.5);
                
                textureLoader.load(fotoSrc, (tex) => {
                    const planeMat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, transparent: true });
                    const mesh = new THREE.Mesh(planeGeo, planeMat);
                    mesh.position.set(x, y, z);
                    mesh.lookAt(0, y, 0);
                    galaxiaGrupo.add(mesh);
                    meshesFotos.push(mesh);
                }, undefined, () => {});

                const labelDiv = document.createElement('div');
                labelDiv.className = 'foto-label';
                labelDiv.innerText = mensagensFotos[index % mensagensFotos.length];
                containerLabels.appendChild(labelDiv);

                labelsData.push({
                    element: labelDiv,
                    position: new THREE.Vector3(x, y + 4.5, z)
                });
            });
        }
        criarGalaxiaDetalhada();

        // Estados e Controle da Animação
        let estadoSeq = 0; // 0: Parado, 1: Redemoinho, 2: Explosão + Recuo da Câmera, 3: Galáxia Final
        let anguloGiroVortex = 0;
        let modoAutomatico = false;

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('question-modal').style.display = 'none';
            
            const musica = document.getElementById('bg-music');
            musica.volume = 0.5;
            musica.play().catch(() => {});

            estadoSeq = 1;
        });

        const modalCarta = document.getElementById('modal-carta');
        document.getElementById('btn-carta').addEventListener('click', () => {
            modalCarta.style.display = 'flex';
        });
        document.getElementById('fechar-carta').addEventListener('click', () => {
            modalCarta.style.display = 'none';
        });

        const btnModo = document.getElementById('btn-modo');
        btnModo.addEventListener('click', () => {
            modoAutomatico = !modoAutomatico;
            btnModo.innerText = modoAutomatico ? "🎥 Auto: ON" : "🎥 Auto: OFF";
        });

        let anguloCameraGalaxia = 0;

        function animate() {
            requestAnimationFrame(animate);

            // 1. Redemoinho
            if (estadoSeq === 1) {
                if (camera.position.z > 0) {
                    camera.position.z -= 20;
                } else {
                    // Chegou no centro -> Dispara Explosão e inicia recuo da câmera
                    if (vortexParticles) {
                        scene.remove(vortexParticles);
                        vortexParticles = null;
                    }
                    if (explosionParticles) explosionParticles.active = true;
                    estadoSeq = 2;
                }

                if (vortexParticles) {
                    anguloGiroVortex += 0.05;
                    vortexParticles.rotation.z = anguloGiroVortex;
                }
            }

            // 2. Explosão e Câmera Indo para Trás para ver a Galáxia
            if (estadoSeq === 2) {
                // Afasta a câmera para longe (posição final de visão da galáxia: z = 220, y = 110)
                if (camera.position.z < 220) {
                    camera.position.z += 4.5;
                    camera.position.y += 2.2;
                    camera.lookAt(0, 0, 0);
                } else {
                    estadoSeq = 3; // Galáxia Final Completa
                    controls.enabled = true;
                    document.getElementById('main-title').style.display = 'block';
                    document.getElementById('btn-modo').style.display = 'block';
                    document.getElementById('btn-carta').style.display = 'flex';
                }

                if (explosionParticles && explosionParticles.active) {
                    const pos = explosionParticles.mesh.geometry.attributes.position.array;
                    const vel = explosionParticles.velocities;
                    for (let i = 0; i < vel.length; i++) {
                        pos[i*3] += vel[i].x;
                        pos[i*3+1] += vel[i].y;
                        pos[i*3+2] += vel[i].z;
                    }
                    explosionParticles.mesh.geometry.attributes.position.needsUpdate = true;
                }
            }

            // 3. Galáxia Final interativa
            if (estadoSeq === 3) {
                if (modoAutomatico) {
                    anguloCameraGalaxia += 0.002;
                    camera.position.x = Math.cos(anguloCameraGalaxia) * 160;
                    camera.position.z = Math.sin(anguloCameraGalaxia) * 160;
                    camera.position.y = 80 + Math.sin(anguloCameraGalaxia * 2) * 20;
                    camera.lookAt(0, 0, 0);
                }

                galaxiaGrupo.rotation.y += 0.0006;

                const tempV = new THREE.Vector3();
                labelsData.forEach(item => {
                    tempV.copy(item.position);
                    tempV.applyMatrix4(galaxiaGrupo.matrixWorld);
                    tempV.project(camera);

                    const x = (tempV.x *  .5 + .5) * window.innerWidth;
                    const y = (tempV.y * -.5 + .5) * window.innerHeight;

                    if (tempV.z < 1 && x >= 0 && x <= window.innerWidth && y >= 0 && y <= window.innerHeight) {
                        item.element.style.display = 'block';
                        item.element.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
                        
                        const distancia = camera.position.distanceTo(item.position);
                        item.element.style.opacity = distancia < 90 ? '1' : '0';
                    } else {
                        item.element.style.display = 'none';
                    }
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
